version: 2
sql:
  - engine: "postgresql"
    queries: "./internal/repository/queries"
    schema: "./internal/repository/migrations"
    gen:
      go:
        emit_json_tags: true
        out: "./internal/repository"
        package: "repository"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "decimal"
            go_type:
              type: "float64"